openapi: 3.0.3
info:
  title: Sistema Bancario Distribuido - Nodo 2 (Sucursal Administrativa)
  description: |
    API web de la Sucursal Administrativa. Gestiona apertura de cuentas,
    consulta de saldos y movimientos, y reportes de corte de caja,
    comunicándose de forma sincrónica con el Nodo 1 (Banco Central).
  version: 1.0.0
servers:
  - url: https://sucursal-nodo2-nyl2.onrender.com
    description: Producción
  - url: http://localhost:3000
    description: Desarrollo local
tags:
  - name: Autenticación
  - name: Cuentas
  - name: Reportes
paths:
  /login:
    get:
      tags: [Autenticación]
      summary: Muestra el formulario de inicio de sesión
      responses:
        "200":
          description: Vista HTML de login
          content:
            text/html:
              schema:
                type: string
    post:
      tags: [Autenticación]
      summary: Inicia sesión como ejecutivo de cuenta
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
                  format: password
      responses:
        "302":
          description: Redirige al dashboard si las credenciales son válidas
        "401":
          description: Credenciales inválidas
  /logout:
    get:
      tags: [Autenticación]
      summary: Cierra la sesión actual
      responses:
        "302":
          description: Redirige a /login
  /new-client:
    get:
      tags: [Cuentas]
      summary: Muestra el formulario de apertura de cuenta
      security:
        - sessionAuth: []
      responses:
        "200":
          description: Vista HTML del formulario
          content:
            text/html:
              schema:
                type: string
  /create-account:
    post:
      tags: [Cuentas]
      summary: Registra un cliente y solicita al Banco Central un número de cuenta de 10 dígitos
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                nombre:
                  type: string
                saldo_inicial:
                  type: number
                  minimum: 0
      responses:
        "302":
          description: Redirige al dashboard con notificación de éxito
        "400":
          description: Datos inválidos
        "502":
          description: Error de comunicación con el Banco Central
  /search-account:
    get:
      tags: [Cuentas]
      summary: Consulta saldo e historial de movimientos de una cuenta
      security:
        - sessionAuth: []
      parameters:
        - name: account
          in: query
          required: true
          description: Número de cuenta de 10 dígitos
          schema:
            type: string
            pattern: "^[0-9]{10}$"
      responses:
        "200":
          description: Vista HTML con detalles de la cuenta
          content:
            text/html:
              schema:
                type: string
        "404":
          description: Cuenta no encontrada
  /reports:
    get:
      tags: [Reportes]
      summary: Corte de caja y métricas de liquidez de la sucursal
      security:
        - sessionAuth: []
      responses:
        "200":
          description: Vista HTML del reporte, adaptada para impresión o PDF
          content:
            text/html:
              schema:
                type: string
components:
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: connect.sid
